name: links

on:
  schedule:
    # Weekly, Monday 09:00 UTC
    - cron: "0 9 * * 1"
  workflow_dispatch: {}

jobs:
  lychee:
    name: lychee link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          # 403: npmjs.com anti-bot blocks crawlers; 405: api.gemina.co MCP endpoint only accepts POST (GET → 405, which means it's alive)
          args: --no-progress --accept 200,206,403,405,429 './**/*.md' './**/*.yml' './**/*.yaml' './server.json' './glama.json'
          fail: true
